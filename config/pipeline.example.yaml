input_path: samples/samples.jsonl
artifacts_dir: artifacts/pipeline
stages:
  - name: refine
    kind: refine
    enabled: true
    resume: true
    output: data.jsonl
    params:
      use_llm: true
      llm_base_url: http://127.0.0.1:8848/v1
      llm_model: qwen3vl_32binst
      llm_api_key: not-needed
      llm_timeout_s: 120
      llm_temperature: 1.0
      strict_validation: false
      limit: null
      workers: 8
      fail_fast: false
  - name: qa_metadata
    kind: qa
    enabled: false
    resume: true
    depends_on: refine
    output: data.jsonl
    params:
      sub_tasks:
        scene_caption: 1
        image_position: 3
        image_relative_position: 3
        object_orientation: 3
        egocentric_reltaion: 3
        allocentric_relation: 3
  - name: qa_aggregate
    kind: qa_aggregate
    enabled: false
    resume: true
    depends_on: qa_metadata
    output: data.jsonl
    params: {}
  - name: qa_export
    kind: qa_export
    enabled: false
    resume: true
    depends_on: qa_aggregate
    output: data.jsonl
    params:
      shard_size: 8192
      image_root: null
